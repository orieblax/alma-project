name: Frontend CI - Next.js

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Type-Check & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint Code Quality Check
        run: |
          npm run lint

      - name: TypeScript Type-Check
        run: |
          npx tsc --noEmit

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: "https://alma-backend.onrender.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://yaudeaxyjtibcotjnalt.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_EAbBLM8mHQ6OEAIgy8EMZg_ooeaQZ8R"
        run: |
          npm run build
