name: Backend CI - Django & pgvector

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: alma_test_db
          POSTGRES_USER: alma_user
          POSTGRES_PASSWORD: alma_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings (max line length 120)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Django Tests (PostgreSQL + pgvector)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-insecure-django-secret-key-for-automated-tests"
          USE_SQLITE: "False"
          DB_NAME: "alma_test_db"
          DB_USER: "alma_user"
          DB_PASSWORD: "alma_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          JWT_SECRET: "ci-jwt-secret-testing-key-123456789"
          EMBEDDING_DIMENSIONS: "384"
        run: |
          python manage.py test tests --verbosity=2
