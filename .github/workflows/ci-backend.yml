name: Backend CI - Django & pgvector

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Integrity Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: alma_test_db
          POSTGRES_USER: alma_user
          POSTGRES_PASSWORD: alma_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r requirements.txt

      - name: Flake8 Code Quality & Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Informative style check (warns on complexity > 12, max length 120)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Verify Django System Configuration
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-insecure-django-secret-key-for-automated-tests"
          USE_SQLITE: "True"
          JWT_SECRET: "ci-jwt-secret-testing-key-123456789"
        run: |
          python manage.py check

      - name: Detect Missing Migrations (Migration Drift Check)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-insecure-django-secret-key-for-automated-tests"
          USE_SQLITE: "True"
          JWT_SECRET: "ci-jwt-secret-testing-key-123456789"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Django Tests (PostgreSQL + pgvector Service)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-insecure-django-secret-key-for-automated-tests"
          USE_SQLITE: "False"
          DB_NAME: "alma_test_db"
          DB_USER: "alma_user"
          DB_PASSWORD: "alma_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_SSLMODE: "disable"
          JWT_SECRET: "ci-jwt-secret-testing-key-123456789"
          EMBEDDING_DIMENSIONS: "384"
          USE_OLLAMA: "False"
          OLLAMA_TIMEOUT_SECONDS: "5"
          OLLAMA_EMBED_TIMEOUT: "5"
        run: |
          coverage run manage.py test tests --verbosity=2
          coverage report -m
